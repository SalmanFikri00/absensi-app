services:
  web:
    image: poshadir:local
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_PATH: /data/attendance.db
      ADMIN_PIN: ${ADMIN_PIN:-2468}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-this-admin-session-secret}
      QR_SECRET: ${QR_SECRET:-change-this-qr-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLOUD_WEBHOOK_URL: ${CLOUD_WEBHOOK_URL:-}
      CLOUD_WEBHOOK_TOKEN: ${CLOUD_WEBHOOK_TOKEN:-}
    volumes:
      - attendance-data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/users').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  sync-worker:
    image: poshadir:local
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["bun", "run", "worker/sync-worker.ts"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_PATH: /data/attendance.db
      QR_SECRET: ${QR_SECRET:-change-this-qr-secret}
      CLOUD_WEBHOOK_URL: ${CLOUD_WEBHOOK_URL:-}
      CLOUD_WEBHOOK_TOKEN: ${CLOUD_WEBHOOK_TOKEN:-}
    volumes:
      - attendance-data:/data
    mem_limit: 96m
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  attendance-data:
  caddy-data:
  caddy-config:
